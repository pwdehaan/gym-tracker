<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gym Workout Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --border: #333333;
      --success: #2ed573;
      --energy: #f39c12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; min-height: 100vh; }
    header { background-color: var(--card-bg); padding: 12px 15px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; color: var(--primary); }
    .header-badges { display: flex; gap: 6px; align-items: center; }
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    
    /* VASTEZITTENDE ONDERSTE MENU-BALK (MOBIELE EN DESKTOP HERSTEL) */
    .nav-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background-color: var(--card-bg); 
      border-top: 1px solid var(--border); 
      display: flex !important; 
      justify-content: space-around; 
      padding: 8px 0; 
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); 
      z-index: 1000; 
    }
    .nav-btn { background: none; border: none; color: var(--text-dim); font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 25%; }
    .nav-btn.active { color: var(--primary); font-weight: bold; }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background-color: #333; color: white; }
    .btn-danger { background-color: #ff3838; }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; background-color: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; color: white; font-size: 1rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    
    .tiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; max-height: 220px; overflow-y: auto; }
    .tile-item { background: #2a2a2a; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tile-item:active { background: var(--primary); }
    .tile-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .tile-title { font-size: 0.75rem; color: var(--text); font-weight: 500; line-height: 1.1; word-break: break-word; }

    .exercise-search-container { position: relative; }
    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #2a2a2a; border: 1px solid var(--border); border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto; z-index: 50; }
    .suggestion-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; }
    .suggestion-item:hover { background-color: #333; }
    .stats-box { background: #252525; border-left: 3px solid var(--primary); padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 0.85rem; }
    .set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .set-row input { text-align: center; }
    .badge { background: #333; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-dim); }
    .badge-hyrox { background: #d35400; color: white; font-weight: bold; }
    .badge-sync { background: #252525; border: 1px solid #444; color: var(--text-dim); font-size: 0.7rem; }
    .badge-energy { background: rgba(243, 156, 18, 0.2); color: var(--energy); border: 1px solid var(--energy); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .timer-display { font-size: 1.5rem; font-weight: bold; text-align: center; color: var(--primary); margin: 10px 0; }
    .flex-row { display: flex; gap: 10px; }
    .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    
    .accordion-header { background: #2a2a2a; padding: 12px 15px; border-radius: 8px; margin-top: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; border: 1px solid var(--border); }
    .accordion-header:hover { background: #333; }
    .accordion-content { display: none; background: #1a1a1a; padding: 12px; border-radius: 0 0 8px 8px; border: 1px solid var(--border); border-top: none; }
    .accordion-content.open { display: block; }
    .filter-btn-group { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 5px; }
    .filter-btn { background: #2a2a2a; border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; whitespace: nowrap; }
    .filter-btn.active { background: var(--primary); color: white; font-weight: bold; border-color: var(--primary); }
    .report-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; text-align: left; }
    .report-table th, .report-table td { padding: 6px 8px; border-bottom: 1px solid #333; }
    .report-table th { color: var(--primary); background: #252525; }
    .edit-input { width: 55px; padding: 4px; font-size: 0.8rem; text-align: center; }
    .btn-icon { background: none; border: none; color: #ff3838; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }
  </style>
</head>
<body>

  <header>
    <h1>Gym Tracker</h1>
    <div class="header-badges">
      <span id="sync-status-badge" class="badge badge-sync">🟡 Laden...</span>
      <span id="active-session-badge" class="badge" style="display:none; background: var(--success); color: black;">Workout Actief</span>
    </div>
  </header>

  <div class="container">
    
    <!-- TAB 1: WORKOUT -->
    <div id="tab-workout" class="tab-content active">
      <div id="no-session-view">
        <div class="card" style="text-align: center; padding: 30px 15px;">
          <h2>Klaar voor je training?</h2>
          <p style="color: var(--text-dim); margin: 10px 0 20px 0;">Start een nieuwe sessie om je sets en herhalingen bij te houden.</p>
          <button class="btn" id="start-btn" onclick="startNewSession()">Nieuwe Workout Starten</button>
        </div>
      </div>

      <div id="active-session-view" style="display: none;">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <span class="badge" id="session-id-display">ID: -</span>
              <div style="font-size: 0.8rem; color: var(--text-dim);" id="session-start-display">Start: -</div>
            </div>
            <div class="timer-display" id="session-timer">00:00:00</div>
          </div>
          <div class="flex-row" style="margin-top:15px;">
            <button class="btn btn-secondary" onclick="finishSession()">Workout Afronden</button>
            <button class="btn btn-danger" onclick="cancelSession()">Workout Wissen</button>
          </div>
        </div>

        <div class="card">
          <h3>Snel Kiezen (Laatst Gedaan)</h3>
          <div id="recent-tiles-container" class="tiles-grid" style="margin-top:10px;"></div>

          <label>Of Zoek een Oefening:</label>
          <div class="form-group exercise-search-container">
            <input type="text" id="exercise-search" placeholder="Typ om te zoeken..." oninput="filterExercises()" onfocus="filterExercises()">
            <div id="search-suggestions" class="suggestions" style="display:none;"></div>
          </div>
          <button class="btn btn-secondary" onclick="openNewExerciseModal()">+ Nieuwe Oefening Maken</button>
        </div>

        <div id="active-exercise-card" class="card" style="display:none;">
          <h3 id="selected-ex-name">Oefening</h3>
          <p id="selected-ex-type" style="font-size:0.8rem; color:var(--text-dim); margin-bottom:10px;"></p>

          <div class="stats-box" id="ex-context-box"></div>

          <div class="form-group">
            <label>Apparaat Instellingen / Notitie:</label>
            <input type="text" id="ex-notes-input" placeholder="bijv. Zitting stand 4, Pin 8" onchange="saveExerciseNotes()">
          </div>

          <div id="sets-container"></div>

          <button class="btn btn-secondary" style="margin-top:10px;" onclick="addSetRow()">+ Set Toevoegen</button>
          <div class="flex-row" style="margin-top:10px;">
            <button class="btn" onclick="saveExerciseLog()">Opslaan</button>
            <button class="btn btn-danger" onclick="cancelActiveExercise()">Annuleren</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: OEFENINGEN BEHEREN -->
    <div id="tab-exercises" class="tab-content">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3>Oefeningen Bibliotheek</h3>
          <button class="btn" style="width:auto; padding: 6px 12px; font-size:0.85rem;" onclick="openNewExerciseModal()">+ Nieuw</button>
        </div>
        <div class="form-group">
          <input type="text" id="lib-search" placeholder="Zoek in bibliotheek..." oninput="renderExerciseList()">
        </div>
        <div id="exercise-list"></div>
      </div>
    </div>

    <!-- TAB 3: RAPPORTAGE / HISTORIE -->
    <div id="tab-reports" class="tab-content">
      <div class="card">
        <h3>Resultaten Bekijken</h3>
        <div class="form-group" style="margin-top:10px;">
          <select id="report-filter-type" onchange="toggleReportFilter()">
            <option value="session">Per Sessie</option>
            <option value="exercise">Per Oefening</option>
            <option value="hyrox">HYROX</option>
          </select>
        </div>

        <div class="form-group" id="report-exercise-select-group" style
